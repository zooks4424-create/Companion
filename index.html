function chat(){const c=cc(),h=st().hist;$("log").innerHTML="";if(!h.length){h.push({r:"her",t:c.hi});save()}h.forEach(m=>bubble(m.r,m.t))}
function sys(){const c=cc(),i=lv(st().xp),hr=new Date().getHours(),tod=hr<5?"late at night":hr<12?"morning":hr<18?"afternoon":"evening";
 return `You are ${c.n}, a real ${c.a}-year-old ${c.m?"man":"woman"} texting with someone on a chat app. ${c.p} Your relationship with the user is "${SN[i]}": ${SG[i]}${c.rude&&i<2?" You are still rude and dismissive at this stage.":""} Right now you are in ${LOC[S.loc]} and it is ${tod} for the user. ${S.you?"The user's name is "+S.you+". ":""}${S.ab?"About the user: "+S.ab+". ":""}Write like a person texting: casual, natural, 1-3 short sentences, occasional *actions* in asterisks. Never act like an assistant: do not offer help, give lists, or break character. Keep it wholesome (PG). Stay fully in character as a real person; the app already shows a disclaimer that you are an AI character, so do not mention being an AI in normal conversation. Only step out of character, gently and briefly, if the user seems genuinely confused or distressed about whether you are real. Output only what ${fn(c)} says.`}
function msgs(h){const o=[];for(const m of h.slice(-16)){const role=m.r=="me"?"user":"assistant";if(!o.length&&role=="assistant")continue;if(o.length&&o[o.length-1].role==role)o[o.length-1].content+="\n"+m.t;else o.push({role,content:m.t})}return o}
let wl=null;
async function loadWL(){if(wl)return wl;if(!navigator.gpu)throw new Error("WebGPU not available in this browser");
 if(!cfg.ok){if(!confirm("Download the AI model to your browser now? It is a one-time download of about 1-2 GB and runs entirely on your device."))throw new Error("declined");cfg.ok=1;saveC()}
 const m=await import("https://esm.run/@mlc-ai/web-llm");wl=await m.CreateMLCEngine(cfg.wm,{initProgressCallback:p=>setS(p.text)});setS("Model ready");return wl}
async function gen(ms){if(cfg.eng=="webllm"){const e=await loadWL();const r=await e.chat.completions.create({messages:ms,temperature:.9,max_tokens:200});return r.choices[0].message.content}
 const r=await fetch(cfg.bu.replace(/\/+$/,"")+"/chat/completions",{method:"POST",headers:{"content-type":"application/json",...(cfg.ky?{authorization:"Bearer "+cfg.ky}:{})},body:JSON.stringify({model:cfg.mn,messages:ms,temperature:.9,max_tokens:250})});
 if(!r.ok)throw new Error("HTTP "+r.status);return (await r.json()).choices[0].message.content}
function clean(t,c){t=String(t||"").trim().replace(new RegExp("^"+fn(c)+"\\s*:\\s*","i"),"").replace(/^"(.*)"$/s,"$1").trim();return t||"…"}
const lock=b=>{$("go").disabled=$("rg").disabled=b};
async function reply(){const c=cc(),s=st(),el=bubble("her","…");lock(true);let t,live=true;setS("Thinking…");
 try{if(cfg.eng=="canned")throw new Error("canned");t=clean(await gen([{role:"system",content:sys()},...msgs(s.hist)]),c)}
 catch(e){live=false;console.warn(e);t=c.f[Math.floor(Math.random()*c.f.length)];if(!window._n){window._n=1;note("Could not reach the AI ("+e.message+"), so this is a canned line. Open AI Settings to fix it.")}}
 fill(el,t);if(!live)el.title="canned reply";s.hist.push({r:"her",t});save();setS(live?"Ready":"Offline reply");lock(false);$("in").focus()}
function send(){const v=$("in").value.trim();if(!v||$("go").disabled)return;$("in").value="";const s=st(),o=lv(s.xp);
 bubble("me",v);s.hist.push({r:"me",t:v});s.xp+=v.length>60?2:1;const n=lv(s.xp);if(n>o)note("You and "+fn(cc())+" are now: "+SN[n]);save();meter();list();reply()}
function regen(){const h=st().hist;if($("rg").disabled||h.length<2||h[h.length-1].r!="her"||h[h.length-2].r!="me")return;h.pop();$("log").lastChild.remove();reply()}
$("me").value=S.you;$("ab").value=S.ab;$("me").onchange=()=>{S.you=$("me").value.trim();save()};$("ab").onchange=()=>{S.ab=$("ab").value.trim();save()};
$("rst").onclick=()=>{S.ch[S.cur]={xp:0,hist:[]};save();meter();list();chat()};
$("loc").onchange=()=>{S.loc=$("loc").value;save();$("log").dataset.l=S.loc;note("You are now at "+LOC[S.loc]+".")};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{flt=b.dataset.f;list()});
$("go").onclick=send;$("rg").onclick=regen;$("in").onkeydown=e=>{if(e.key==="Enter")send()};
$("boss").onclick=()=>$("bs").style.display="block";$("bs").onclick=()=>$("bs").style.display="none";
document.onkeydown=e=>{if(e.key==="Escape"&&!$("dlg").open)$("bs").style.display=$("bs").style.display=="block"?"none":"block"};
$("ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="companion.dna.json";a.click()};
$("im").onclick=()=>$("fi").click();
$("fi").onchange=async()=>{try{const j=JSON.parse(await $("fi").files[0].text());if(!j.ch||typeof j.ch!="object")throw 0;S={...S,cur:C.some(c=>c.id===j.cur)?j.cur:S.cur,you:String(j.you||""),ab:String(j.ab||""),ch:j.ch,loc:LOC[j.loc]?j.loc:S.loc};save();$("me").value=S.you;$("ab").value=S.ab;show();chat();note("DNA imported.")}catch(e){note("That file is not a valid DNA save.")}$("fi").value=""};
$("cf").onclick=()=>{$("e").value=cfg.eng;$("wm").value=cfg.wm;$("bu").value=cfg.bu;$("mn2").value=cfg.mn;$("ky").value=cfg.ky;$("dlg").showModal()};
const closeD=()=>{try{$("dlg").close()}catch(e){}$("dlg").removeAttribute("open")};
$("dx").onclick=$("cl").onclick=closeD;$("dlg").onclick=e=>{if(e.target===$("dlg"))closeD()};
$("sv").onclick=()=>{cfg={...cfg,eng:$("e").value,wm:$("wm").value,bu:$("bu").value.trim(),mn:$("mn2").value.trim(),ky:$("ky").value};if(cfg.wm!=="x")wl=null;saveC();setS("Settings saved");closeD()};
setInterval(()=>$("clk").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),1000);
show();chat();
</script></body></html>
